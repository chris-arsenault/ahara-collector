[package]
name = "ahara-collector"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "ahara-collector"
path = "src/main.rs"

[lib]
name = "ahara_collector"
path = "src/lib.rs"
